name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without leading v (e.g. 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Version pins land only here; main keeps :latest
  RELEASE_BRANCH: release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Validate version
        id: ver
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION (expected semver like 1.2.3)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          OWNER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${OWNER_REPO}:v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Guard against existing tag
        run: |
          if git rev-parse "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.ver.outputs.tag }} already exists"
            exit 1
          fi
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.ver.outputs.tag }} already exists"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin compose, tag, and push release branch
        id: pin
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # release branch = released code + pinned compose (main stays :latest)
          git checkout -B "${{ env.RELEASE_BRANCH }}" "${{ github.sha }}"

          python3 <<'PY'
          from pathlib import Path
          import re

          image = "${{ steps.ver.outputs.image }}"
          pattern = re.compile(r"(image: \$\{JOJOBUDDY_IMAGE:-)[^}]+\}")
          total = 0
          for name in ("docker-compose.yml", "docker-compose.nas.yml"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              updated, count = pattern.subn(rf"\1{image}}}", text)
              if count < 1:
                  raise SystemExit(f"No JOJOBUDDY_IMAGE defaults found in {name}")
              path.write_text(updated, encoding="utf-8")
              total += count
              print(f"{name}: updated {count} image pin(s) -> {image}")
          print(f"total pins: {total}")
          PY

          grep -n "JOJOBUDDY_IMAGE" docker-compose.yml docker-compose.nas.yml
          git add docker-compose.yml docker-compose.nas.yml
          if git diff --cached --quiet; then
            echo "Compose already pinned to this image"
          else
            git commit -m "chore(release): pin compose images to ${{ steps.ver.outputs.tag }}"
          fi

          # Tag the pin commit so blob/vX.Y.Z shows versioned compose
          git tag -a "${{ steps.ver.outputs.tag }}" -m "Release ${{ steps.ver.outputs.tag }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          git push --force-with-lease origin "HEAD:${{ env.RELEASE_BRANCH }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA=()
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            EXTRA+=(--prerelease)
          fi
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            "${EXTRA[@]}"
