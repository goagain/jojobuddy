# Local / generic compose.
# main  → always :latest
# release → CI pins :vX.Y.Z (same as docker-compose.nas.yml)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    ports:
      - "27017:27017"
    volumes:
      - jojobuddy-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  migrate:
    image: ${JOJOBUDDY_IMAGE:-ghcr.io/goagain/jojobuddy:v0.0.44}
    build: .
    restart: "no"
    # One-shot: indexes + root bootstrap, then exit. Recreated when the image changes.
    environment:
      JOJOBUDDY_ROLE: migrate
      MONGODB_URI: mongodb://mongo:27017/jojobuddy
      MONGODB_MAX_POOL_SIZE: "5"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    image: ${JOJOBUDDY_IMAGE:-ghcr.io/goagain/jojobuddy:v0.0.44}
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      JOJOBUDDY_ROLE: web
      MONGODB_URI: mongodb://mongo:27017/jojobuddy
      MONGODB_MAX_POOL_SIZE: "20"
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: ${JOJOBUDDY_IMAGE:-ghcr.io/goagain/jojobuddy:v0.0.44}
    build: .
    restart: unless-stopped
    environment:
      JOJOBUDDY_ROLE: worker
      MONGODB_URI: mongodb://mongo:27017/jojobuddy
      MONGODB_MAX_POOL_SIZE: "5"
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  jojobuddy-mongo:
